# Cloudflare Tunnel configuration
# Copy to /etc/cloudflared/config.yml and edit

tunnel: YOUR_TUNNEL_ID
credentials-file: /root/.cloudflared/YOUR_TUNNEL_ID.json

ingress:
  # Website (static site on port 4321)
  - hostname: your-site.com
    service: http://192.168.1.107:4321

  # API server
  - hostname: api.your-site.com
    service: http://192.168.1.105:3000

  # Home Assistant
  - hostname: ha.your-site.com
    service: http://192.168.1.106:8123

  # Catch-all (required)
  - service: http_status:404
